<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Estúdio de render</title>
    <style>
      html, body { margin: 0; background: #000; }
      body.transparent, html.transparent { background: transparent; }
      #shot { position: relative; }
      #shot canvas { display: block; width: 100%; height: 100%; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="shot"></div>
    <script type="module">
      import { PerspectiveCamera, Spherical, Vector3 } from "three";
      import { createStudio, loadCar, prepareCar } from "../js/hero3d.js";
      import { featured } from "../js/config.js";

      const q = new URLSearchParams(location.search);
      const n = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
      const p = {
        r: n("r", 9), phi: n("phi", 1.33), theta: n("theta", 0.72), fov: n("fov", 28),
        tx: n("tx", 0), ty: n("ty", 0.55), tz: n("tz", 0.15), w: n("w", 1600), h: n("h", 1000),
        bg: q.get("bg") !== "0", variant: q.get("variant") || featured.paints[0].variant,
      };

      const shot = document.getElementById("shot");
      shot.style.width = p.w + "px";
      shot.style.height = p.h + "px";
      if (p.bg) {
        shot.style.background =
          "radial-gradient(55% 40% at 50% 78%, rgba(58,61,67,.55) 0%, rgba(0,0,0,0) 72%), radial-gradient(90% 60% at 50% 0%, rgba(31,33,37,.9) 0%, rgba(0,0,0,0) 70%), #000";
      } else {
        document.documentElement.classList.add("transparent");
        document.body.classList.add("transparent");
      }

      const studio = createStudio(shot, { quality: "high", preserveDrawingBuffer: true });
      studio.renderer.setPixelRatio(1);
      studio.renderer.setSize(p.w, p.h, false);
      const gltf = prepareCar(await loadCar("../" + featured.model.src), featured.model.hiddenMeshes);
      await studio.applyVariant(gltf, p.variant);
      studio.scene.add(gltf.scene);
      studio.shadow.bake();

      const camera = new PerspectiveCamera(p.fov, p.w / p.h, 0.1, 80);
      const target = new Vector3(p.tx, p.ty, p.tz);
      camera.position.setFromSpherical(new Spherical(p.r, p.phi, p.theta)).add(target);
      camera.lookAt(target);
      studio.renderer.render(studio.scene, camera);
      window.__ready = true;
    </script>
  </body>
</html>
